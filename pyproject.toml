[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "coursedata_0120_1268"
version = "0.0.1"
description = "Course data for MATH-UA 120 Discrete Mathematics (Section 016), Fall 2026"
authors = [
  { name = "Matthew Leingang" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "coursedata",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.5.0",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "nbstripout",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.13.0"

[tool.uv.workspace]
# "generic" is the actual course-data package (imported as `coursedata`),
# checked out here as a git submodule from the shared ccds-coursedata
# template repo. Declaring it as a workspace member (rather than a manual
# `uv pip install -e generic`) means `uv sync` at the repo root always
# reinstalls it and its dependencies (including python-edubag) instead of
# silently stripping an untracked editable install.
members = ["generic"]

[tool.uv.sources]
coursedata = { workspace = true }
# To test local edubag changes before pushing to github.com/nyumathclinic/python-edubag, add:
# python-edubag = { path = "/Users/matthew/Library/CloudStorage/Box-Box/github/python-edubag", editable = true }
# Remove it again (and rerun `uv sync`) once verified and pushed upstream.

[tool.ruff]
line-length = 99
src = ["coursedata_0120_1268"]
include = ["pyproject.toml", "coursedata_0120_1268/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["coursedata_0120_1268"]
force-sort-within-sections = true

[tool.coursedata]
course_name = "Discrete Mathematics"
term_name = "Fall 2026"

[tool.coursedata.albert]
# course ID's of all sections (five-digit number, quoted as a string)
courses=["10433","10434","10435","10437","10438"]
# Albert term number
# 1 - ???
# YY - last two digits of calendar year
# N - academic term (4 - spring, 8 - fall)
term_number="1268"
subject = "MATH-UA"
catalog_number = "120"

# Class numbers to fetch HTML photo rosters for (converted to JSON + Anki decks).
# Only the latest copy is kept, in data/{raw,processed}/albert/rosters/latest/<class number>.
photo_rosters = ["10433"]

# course ID's of all Brightspace sites (six-digit number, quoted as a string)
[tool.coursedata.brightspace]
courses = ["609453"]

# Quiz reports for `python -m coursedata.dataset get brightspace quizzes`, saved to
# data/raw/brightspace/quizzes/<course>. Both keys are optional.
[tool.coursedata.brightspace.quizzes]
courses = ["609453"]                               # default: all brightspace courses
# reports = ["Question Details", "User Attempts"]    # report names or types; default: all

# course ID's of all Gradescope sites (seven-digit number, quoted as a string)
# keep in increasing order of section number
[tool.coursedata.gradescope]
courses = ["1352536"]

# Grading dashboards for multi-part, multi-version exams; see
# generic/coursedata/dataset/gradescope/grading.py. `python -m coursedata.dataset watch
# gradescope-grading ch5-6` keeps a live dashboard under data/processed/gradescope/grading/.
[tool.coursedata.gradescope.grading.mt1]
title = "Midterm I"
course = "1352536"
roster = "MATH-UA_120.016_*_roster.csv"
deadline = "2026-10-21T11:59"   # flags problems projected to finish late

[[tool.coursedata.gradescope.grading.mt1.parts]]
name = "MC"
containers = ["420366"]   # All editions are in one assignment

[[tool.coursedata.gradescope.grading.mt1.parts]]
name = "FR"
containers = ["419614"]

[tool.coursedata.gradescope.grading.mt1.templates]
E = "mt1-M"
Makeup = "mt1-M"

# Homework problems practicing the same skill as an exam item (version A's numbering; the
# notebook aligns the other versions). Gradescope outlines are whole problems, so each entry is
# the problem's total score even where only one part matches.
[tool.coursedata.gradescope.grading.mt1.homework]
Q1 = { assignment = "8652128", question = "1" }     # definition of even <-> HW1.1 definitions ("odd" vs "not even")
Q2 = { assignment = "8652130", question = "2" }     # power set <-> HW3.2 describing subsets of 2^Z
Q3 = { assignment = "8652128", question = "3" }     # negating a quantified sentence <-> HW1.3
Q4 = { assignment = "8652134", question = "1" }     # MATTHEW arrangements <-> HW5.1(a) MISSISSIPPI anagrams
Q5 = { assignment = "8652130", question = "1" }     # inclusion-exclusion <-> HW3.1(a)(iii)
Q26 = { assignment = "8652129", question = "2" }    # n^2 - n + 41 sometimes prime <-> HW2.2 counterexamples
Q29 = { assignment = "8652130", question = "1" }    # multiplication principle <-> HW3.1(b)(i)
Q30a = { assignment = "8652129", question = "4" }   # divisibility iff <-> HW2.4(b)
Q30b = { assignment = "8652129", question = "2" }   # divisibility counterexample <-> HW2.2(d), (e)
Q31a = [                                            # prove a set identity
    { assignment = "8652130", question = "3" },     # HW3.3(b) De Morgan for sets
    { assignment = "8652130", question = "4" },     # HW3.4(a)
]
Q31b = { assignment = "8652130", question = "3" }   # disprove a set identity <-> HW3.3(a) counterexample

# Short names for the homework assignments above, for the notebook's labels
[tool.coursedata.gradescope.grading.mt1.homework_names]
"8652128" = "HW1"
"8652129" = "HW2"
"8652130" = "HW3"
"8652134" = "HW5"

# Who to ping: per problem ("FR.1") or for a whole part ("FR").
[tool.coursedata.gradescope.grading.mt1.graders]
"FR.1" = ["Leyla Sozen-Kohl", "Jeffrey Chen Ono"]
"FR.2.1" = ["Leyla Sozen-Kohl"]
"FR.2.2" = ["Leyla Sozen-Kohl"]
"FR.3.1" = ["Dinh-Quan Tran"]
"FR.3.2" = ["Dinh-Quan Tran"]
"MC"   = ["Matthew Leingang", "Gradescope AI"]

# Publish the public dashboard (no student identifiers) to CIMS web hosting, readable only by
# these NetIDs (NYU single sign-on). `python -m coursedata.dataset publish gradescope-grading`;
# `watch gradescope-grading` publishes after each refresh.
[tool.coursedata.gradescope.grading.publish]
host = "access.cims.nyu.edu"
user = "mpl5"
remote_dir = "/web/mpl5/grading"
url = "https://cims.nyu.edu/~mpl5/grading"
viewers = ["mpl5", "ls5447", "dt2872", "jo2317"]   # add the graders' NetIDs


# Midterm progress report: `python -m coursedata.dataset process midterm-progress` writes
# data/processed/progress/midterm/<date>/, one CSV overall and one per lecture section.
[tool.coursedata.progress_report]
output_path = "progress/midterm/{date}/midterm_progress_report.csv"
# Classification thresholds on 0-1 normalized overall score
strong_threshold = 0.85
satisfactory_threshold = 0.65
min_component_for_strong = 0.70
concerns_below_any = 0.40
midterm_label = "Midterm I"

# Syllabus weights to date (participation 10, problem sets 10, quizzes 10, Midterm I 20),
# normalized; participation is split between attendance/polls and pre-class work.
[tool.coursedata.progress_report.weights]
attendance_participation = 0.10
preclass_assignments = 0.10
problem_sets = 0.20
quizzes = 0.20
midterm_i = 0.40

# Brightspace gradebook category names ("Category:<Name>" in the export headers)
[tool.coursedata.progress_report.categories]
pre_quizzes = "Participation Data - Pre-Quizzes"
pre_surveys = "Participation Data - Pre-Surveys"
polls = "Participation Data - PollEverywhere"
problem_sets = "Problem Sets"
quizzes = "Recitation Quizzes"
midterm = "Midterm I"

[tool.coursedata.progress_report.data_sources.gradebook]
type = "brightspace_gradebook"
path = "brightspace/gradebooks"

[tool.coursedata.progress_report.data_sources.attendance]
type = "attendance"
path = "brightspace/attendance"
stem_contains = "Recitation"
exclude_sessions = ["October 30"]   # 017/018 bulk-marked absent; 019/020 not entered


# course ID's of all EdSTEM sites (five-digit number, quoted as a string)
[tool.coursedata.edstem]
courses= ["101563"]

[tool.coursedata.polleverywhere]
courses= ["62687"]

[tool.coursedata.artifacts]
# Exam serials are all digits; this keeps the testing center's own Code39 barcodes
# (e.g. "E82941240129493") from ever being taken for exam serials.
serial_pattern = '\d+'
# The bubblesheet from Midterm II on labels its ID box "NetID" (Midterm I's said "ID").
bubblesheet_labels = { name = "Name", id = "NetID" }

# Testing-center (Moses Center) exam scans from the AIM instructor portal; see
# generic/coursedata/dataset/aim.py. `python -m coursedata.dataset get aim ch7 [--list]` saves new
# scans to data/raw/artifacts/ch7/ for `process artifacts`; `get aim` alone does every exam
# still active (date .. last date + fetch_days, default 7). Rows match on all keys given.
[tool.coursedata.aim.exams.mt2]
crn   = ["10433"]   # 016; may be dropped once [tool.coursedata.albert].courses exists
type  = ["Exam"]
date  = 2026-11-10
grace_days = 8

[tool.coursedata.aim.exams.q07]
crn   = ["10433"]   
type  = ["Quiz"]
date  = 2026-11-06

[tool.coursedata.aim.exams.q08]
crn   = ["10433"]
type  = ["Quiz"]
date  = 2026-11-13

[tool.coursedata.aim.exams.q09]
crn   = ["10433"]
type  = ["Quiz"]
date  = 2026-11-20

[tool.coursedata.aim.exams.q10]
crn   = ["10433"]
type  = ["Quiz"]
date  = 2026-12-04

[tool.coursedata.aim.exams.q11]
crn   = ["10433"]
type  = ["Quiz"]
date  = 2026-12-11

[tool.coursedata.aim.exams.final]
crn   = ["10433"]
type  = ["Final"]
date  = 2026-12-17
grace_days = 8


[tool.coursedata.drive]
# Optional paths for OAuth installed-app flow. If unset, the downloader first
# tries application default credentials.
# Defaults (when unset) use platformdirs config storage:
#   - token_path:         ~/Library/Application Support/coursedata/google-drive-token.json
#   - client_secret_path: ~/Library/Application Support/coursedata/google-client-secret.json
# client_secret_path = "/absolute/path/to/google-client-secret.json"
# token_path = "/absolute/path/to/google-drive-token.json"
# Example configuration:
# resources = [
#   { name="mpl5-office-hours", id="1zpgmXEDt8r-BbXO7wDqqNQ-zgY_vuLiu9TjIaxSlI00", format="zip" }
#   { name = "lecture-notes", id = "GOOGLE_DOC_FILE_ID", format = "zip", output = "drive/docs" },
#   { name = "section-roster", id = "GOOGLE_SHEET_FILE_ID", format = "csv", output = "drive/spreadsheets" },
# ]
resources = [
  { name = "mpl5-office-hours", id = "10e9XibzykHScumvvwlxMJhe1uDNtlYFJu1V_-Z-NkUc", format = "zip" }
]

[tool.coursedata.sections_dashboard]
title = "Sections Dashboard"
# Relative paths resolve from data/raw for input and data/processed or reports for outputs.
input_path = "albert/class_details"
# Relative to repo root; used by report sections to publish latest/snapshot HTML for Pages.
docs_publish_dir = "docs/docs/sections"

[tool.coursedata.sections_dashboard.field_map]
# Override these key candidates if Albert output changes shape.
section = ["section"]
section_type = ["class_type"]
instructor = ["instructor"]
location = ["location"]
meeting_times = ["days_and_times"]
status = ["status", "class_status"]
capacity = ["class_capacity"]
enrolled = ["enrollment_total"]
waitlist_count = ["wait_list_total"]
waitlist_capacity = ["wait_list_capacity"]

[tool.coursedata.engagement]
# Output CSV path; {date} is substituted with today's ISO date (YYYY-MM-DD).
output_path = "brightspace/grades/{date}/engagement.csv"
# Directory for validation report / warnings files.
report_path = "engagement"
# Set to true to include all per-source columns in the output CSV.
keep_source_columns = false
# Set to true to keep only the "engagement" columns in the output CSV.
keep_only_engagement_columns = true

# ----- Data sources --------------------------------------------------------
# Each key is the logical source name used as column prefix in the merged data.
# Set path to a directory and the newest dated subdirectory + file is auto-
# selected at runtime.

[tool.coursedata.engagement.data_sources.gradebook]
type          = "brightspace_gradebook"
path          = "brightspace/gradebooks"
stem_contains = "120.016"
# Category names must match the "Category:<Name>" header groups in the export.
categories = [
  "Participation Data - Pre-Quizzes",
  "Participation Data - Pre-Surveys",
  "Participation Data - PollEverywhere",
]
# Leave out items not yet due (from numerators and denominators):
# Pre-Quizzes/Pre-Surveys by their due time in the quiz list, polls by the
# date that starts their name ("2026-11-03 Polls - Participation").
quizzes_json = "brightspace/quizzes/609453/quizzes.json"
title_dates  = true

[tool.coursedata.engagement.data_sources.attendance]
type          = "attendance"
path          = "brightspace/attendance"
stem_contains = "Recitation"

[tool.coursedata.engagement.data_sources.edstem]
type          = "edstem_analytics"
path          = "edstem/analytics"
stem_contains = "120.016"

[tool.coursedata.engagement.data_sources.office_hours]
type          = "office_hours_html"
path          = "drive"
stem_contains = "mpl5-office-hours"

# ----- Output columns -------------------------------------------------------
# Denominator column names are auto-generated as:
#   {source}_{sanitized_category}_denominator  for each gradebook category
#   {source}_denominator                        for each attendance source
# where "sanitized" means every non-alphanumeric character becomes "_"
# (so "Participation Data - Pre-Quizzes" → "Participation_Data___Pre_Quizzes").
# Numerator terms with spaces/hyphens are automatically backtick-quoted.

[[tool.coursedata.engagement.columns]]
name        = "Pre-Quiz Completion Rate Points Grade"
numerator   = ["Participation Data - Pre-Quizzes_positive"]
denominator = "gradebook_Participation_Data___Pre_Quizzes_denominator"
scale       = 100.0
max_cap     = 100.0

[[tool.coursedata.engagement.columns]]
name        = "Pre-Survey Completion Rate Points Grade"
numerator   = ["Participation Data - Pre-Surveys_positive"]
denominator = "gradebook_Participation_Data___Pre_Surveys_denominator"
scale       = 100.0
max_cap     = 100.0

[[tool.coursedata.engagement.columns]]
name        = "Poll Participation Rate Points Grade"
numerator   = ["Participation Data - PollEverywhere_positive"]
denominator = "gradebook_Participation_Data___PollEverywhere_denominator"
scale       = 100.0
max_cap     = 100.0

[[tool.coursedata.engagement.columns]]
name        = "Recitation Attendance Points Grade"
numerator   = ["P"]
denominator = "attendance_denominator"
scale       = 100.0
max_cap     = 100.0

[[tool.coursedata.engagement.columns]]
name        = "EdSTEM Activity Points Grade"
numerator   = ["Posts", "2*Answers", "Hearts", "Questions"]
denominator = "1"

[[tool.coursedata.engagement.columns]]
name        = "Office Hour Visits Points Grade"
numerator   = ["visit_count"]
denominator = "1"

[[tool.coursedata.engagement.columns]]
name = "Participation Raw Score Points Grade"
numerator = [
  "Participation Data - Pre-Quizzes_positive",
  "Participation Data - Pre-Surveys_positive",
  "Participation Data - PollEverywhere_positive",
  "P",
  "Posts",
  "2*Answers",
  "Hearts",
  "visit_count",
]
denominator = "gradebook_Participation_Data___Pre_Quizzes_denominator + gradebook_Participation_Data___Pre_Surveys_denominator + gradebook_Participation_Data___PollEverywhere_denominator + attendance_denominator + 3"
scale   = 100.0
max_cap = 100.0

[[tool.coursedata.engagement.columns]]
name           = "Participation Adjusted Score Points Grade"
piecewise_base = "Participation Raw Score Points Grade"
# Piecewise linear mapping with breakpoints (0,0)→(20,20)→(80,100)→(100,100).
piecewise = [
  { condition = "<= 20",         formula = "x" },
  { condition = "> 20 and < 80", formula = "20 + (x - 20) * (4/3)" },
  { condition = ">= 80",         formula = "100" },
]
scale   = 1.0
max_cap = 100.0

[tool.coursedata.daily]
# Configure which steps run for `python -m coursedata.dataset daily`
dataset = [
  "get.albert",
  "get.albert-photo-rosters",
#  "get.brightspace",
#  "get.drive",
  "get.gradescope",
#  "get.edstem",
  "process.enrollment",
  "process.photo-rosters",
  "process.gmail-filters",
#  "process.engagement",
#  "process.midterm-progress",
  "process.sections",
  "report.enrollment",
#  "report.engagement",
  "report.sections",
]

# Configure which steps run for `python -m coursedata.tasks daily`
tasks = [
  "sync-gradescope-rosters",
  "sync-gradescope-sections",
]

# Weekly schedule for `python -m coursedata.schedule run`, which the
# local.coursedataschedule LaunchAgent invokes every 5 minutes. An entry runs once
# on each listed day, at or after `time` (local), within [from, until]; a missed
# time catches up later the same day. State: data/interim/schedule-state.json.
# `python -m coursedata.schedule list` shows entries and last runs.

[[tool.coursedata.schedule]]
name  = "daily-weekly"
days  = ["Mon"]
time  = "05:01"
until = 2026-11-26
run   = ["make daily"]

[[tool.coursedata.schedule]]
name  = "daily-finals"
days  = "daily"
time  = "05:01"
from  = 2026-11-27
until = 2026-12-23
run   = ["make daily"]

# Quiz reports, five minutes after the pre-quizzes/pre-surveys are due
[[tool.coursedata.schedule]]
name  = "quiz-reports"
days  = ["Tue", "Thu"]
time  = "12:05"
until = 2026-12-14
run   = ["python -m coursedata.dataset get brightspace quizzes --due"]

# Testing-center exam scans (every exam whose window is open; see [tool.coursedata.aim]).
# `until` covers the final: 2026-12-17 + grace_days 8 + fetch_days 7.
[[tool.coursedata.schedule]]
name  = "aim-exams"
days  = "daily"
time  = "07:00"
until = 2027-01-01
run   = ["python -m coursedata.dataset get aim"]

# Syncs into Brightspace
[[tool.coursedata.schedule]]
name  = "brightspace-sync"
days  = ["Fri"]
time  = "06:00"
until = 2026-12-23
# (The Poll Everywhere sync runs in `make engagement`, right before the
# gradebook download, so engagement never uses stale polls.)
run   = ["python -m coursedata.tasks post-gradescope-grades"]

# Engagement scores: Poll Everywhere → Brightspace sync, fresh downloads, then
# compute (see the Makefile `engagement` target; it stops at the first failure).
[[tool.coursedata.schedule]]
name  = "engagement"
days  = ["Fri"]
time  = "06:00"
until = 2026-12-23
run   = ["make engagement"]
